[project]
name = "leet75tui"
version = "0.1.0"
description = "LeetCode 75 workbook TUI: catalog, code editor and test runner for TypeScript and Python."
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.12"
dependencies = [
    "textual[syntax]>=8.2,<9",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.scripts]
leet75tui = "leet75tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ships every file under the package, including app.tcss and the runner harnesses.
packages = ["src/leet75tui"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-textual-snapshot>=1.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]
exclude = ["^problems/", "^workbook/", "^tests/fixtures/"]

[tool.coverage.run]
source = ["leet75tui"]
branch = true
omit = [
    # Runs in a child process; covered functionally by tests/test_runner.py.
    "*/src/leet75tui/runner/harness.py",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["problems", "workbook", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
